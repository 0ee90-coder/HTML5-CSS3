<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>박스 정렬</title>
    <link type="text/css" rel="stylesheet" href="../css/17_align.css" />
  </head>
  <body>
    <div class="text-align-left">왼쪽 정렬입니다.</div>
    <div class="text-align-center">가운데 정렬입니다.</div>
    <div class="text-align-right">오른쪽 정렬입니다.</div>

    <div class="text-align-left">
      <div class="inline-box">아이템 1</div>
      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>
    </div>
    <div class="text-align-center">
      <div class="inline-box">아이템 1</div>
      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>
    </div>
    <div class="text-align-right">
      <div class="inline-box">아이템 1</div>
      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>
    </div>
    <div>
      <div class="vertical-align-top">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
      <div class="vertical-align-middle">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
      <div class="vertical-align-bottom">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
    </div>

    <div class="aligns">
      <label for="user-email">User Email</label>
      <input type="email" id="user-email" />

      <label for="user-password">User Password</label>
      <input type="password" id="user-password" />

        src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNjA0MTJfMzUg%2FMDAxNzc1OTc0MjMyNjU2.4DU6tRfj8dH23GdYLLe12QD7gqKBKnfcTppC5HFqlSEg.F5_UUnDeAdh2MsgWDeoDQ_VEcFVCKcz-me8vKXtV7Wwg.PNG%2Fphoto_01.png&type=a340"
      />
